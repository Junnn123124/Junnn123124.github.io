  <style>
    :root {
      --bg: #efeae0;
      --paper: #fffdf8;
      --surface-2: #f3efe6;
      --border: #e5dfd3;
      --border-strong: #d3cab9;
      --text: #1d1b18;
      --text-2: #4a453d;
      --muted: #6b645a;
      --accent: #7a1f2b;
      --accent-dark: #5f1721;
      --ok: #2f5d2a;
      --ok-bg: #e9f2e6;
      --serif: 'Noto Serif KR', 'Nanum Myeongjo', 'Batang', 'AppleMyungjo', Georgia, serif;
      --sans: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      padding: 18px;

    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 2px;
      padding: 38px 36px 32px;
      box-shadow: 0 1px 2px rgba(29, 27, 24, 0.05), 0 12px 32px rgba(29, 27, 24, 0.08);
    }
    .doc-head {
      display: flex;
      justify-content: space-between;

      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .seal {
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;

    h1 {
      margin: 0 0 16px 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;

    .status-box {
      background: var(--surface-2);

      border-radius: 2px;
      padding: 16px 18px;

    }
    .btn {

<body>
  <div class="card">
    <div class="doc-head"><span>NK UCT · Internal</span><span class="seal">Confidential</span></div>

    </div>
  </div>
  <script>
    // NIST P-256 (secp256r1) Public Key Coordinates (검증 전용 공개키 — 개인키는 담당자 PC에만 보관됨)
    const PUB_X = "783ca23609de7d0c611352584051d16a94b0136cd534d4d1eed51b62e10aa0b1";
    const PUB_Y = "85908677519dc0e0a522d3086909f96dd80fb0f7927d2d803e7beb17e03a583b";
    const FALLBACK_URL = "https://medicine-arab-broader-summer.trycloudflare.com";
    const FALLBACK_TS = "2026-11-04T02:40:06.351Z";
    const FALLBACK_SIG = "b7f6032d9ebc4c9ec5a949bc8f562a92f97285a328ea682f4cbdad42cefe35ea6455b07f11272433fea613578eb5564b74eb6bc5d5612f32708f7546e0ab53f7";

    function sha256Hex(ascii) {
      const utf8 = unescape(encodeURIComponent(ascii));
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const l = utf8.length * 8;
      const words = [];
      for (let i = 0; i < utf8.length; i++) words[i >> 2] |= (utf8.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
      words[utf8.length >> 2] |= 0x80 << (24 - (utf8.length % 4) * 8);
      words[(((utf8.length + 8) >> 6) << 4) + 15] = l;
      const W = new Array(64);
      const rotr = (n, x) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < words.length; i += 16) {
        let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (let t = 0; t < 64; t++) {
          if (t < 16) W[t] = words[i + t] | 0;
          else {
            const g0 = rotr(7, W[t - 15]) ^ rotr(18, W[t - 15]) ^ (W[t - 15] >>> 3);
            const g1 = rotr(17, W[t - 2]) ^ rotr(19, W[t - 2]) ^ (W[t - 2] >>> 10);
            W[t] = (W[t - 16] + g0 + W[t - 7] + g1) | 0;
          }
          const s1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + s1 + ch + K[t] + W[t]) | 0;
          const s0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (s0 + maj) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
      }
      return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
    }

    const P256_P = 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn;
    const P256_N = 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n;
    const P256_A = P256_P - 3n;
    const P256_GX = 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296n;
    const P256_GY = 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5n;

    function mod(a, m) { const r = a % m; return r >= 0n ? r : r + m; }
    function modInv(a, m) {
      let t = 0n, newT = 1n, r = m, newR = mod(a, m);
      while (newR !== 0n) {
        const q = r / newR;
        [t, newT] = [newT, t - q * newT];
        [r, newR] = [newR, r - q * newR];
      }
      return mod(t, m);
    }
    function ptAdd(P, Q) {
      if (!P) return Q;
      if (!Q) return P;
      const [x1, y1] = P, [x2, y2] = Q;
      if (x1 === x2) {
        if (mod(y1 + y2, P256_P) === 0n) return null;
        const lam = mod((3n * x1 * x1 + P256_A) * modInv(2n * y1, P256_P), P256_P);
        const x3 = mod(lam * lam - 2n * x1, P256_P);
        return [x3, mod(lam * (x1 - x3) - y1, P256_P)];
      }
      const lam = mod((y2 - y1) * modInv(x2 - x1, P256_P), P256_P);
      const x3 = mod(lam * lam - x1 - x2, P256_P);
      return [x3, mod(lam * (x1 - x3) - y1, P256_P)];
    }
    function ptMul(k, P) {
      let R = null, A = P, n = k;
      while (n > 0n) {
        if (n & 1n) R = ptAdd(R, A);
        A = ptAdd(A, A);
        n >>= 1n;
      }
      return R;
    }
    function verifyEcdsaP256(url, updatedAt, sigHex) {
      try {
        if (typeof sigHex !== 'string' || !/^[0-9a-fA-F]{128}$/.test(sigHex)) return false;
        const r = BigInt('0x' + sigHex.slice(0, 64));
        const s = BigInt('0x' + sigHex.slice(64, 128));
        if (r <= 0n || r >= P256_N || s <= 0n || s >= P256_N) return false;
        const msg = 'NKUCT-TUNNEL-V2|' + url + '|' + updatedAt;
        const e = BigInt('0x' + sha256Hex(msg));
        const w = modInv(s, P256_N);
        const u1 = mod(e * w, P256_N);
        const u2 = mod(r * w, P256_N);
        const Q = [BigInt('0x' + PUB_X), BigInt('0x' + PUB_Y)];
        const R = ptAdd(ptMul(u1, [P256_GX, P256_GY]), ptMul(u2, Q));
        if (!R) return false;
        return mod(R[0], P256_N) === r;
      } catch (err) {
        return false;
      }
    }

    const STRICT_CF_REGEX = /^https:\/\/[a-z0-9-]+\.(trycloudflare\.com|lhr\.life)$/i;
    function selectLatestVerifiedTunnel(candidates, fallbackUrl, fallbackTs, fallbackSig) {
      let bestUrl = null;
      let bestTime = -1;
      if (
        fallbackUrl &&
        STRICT_CF_REGEX.test(fallbackUrl) &&
        verifyEcdsaP256(fallbackUrl, fallbackTs, fallbackSig)
      ) {
        bestUrl = fallbackUrl;
        const parsedFallback = Date.parse(fallbackTs);
        bestTime = Number.isFinite(parsedFallback) ? parsedFallback : 0;
      }
      if (Array.isArray(candidates)) {
        for (let i = 0; i < candidates.length; i++) {
          const item = candidates[i];
          if (!item || !item.tunnelUrl || !item.updatedAt || !item.sig) continue;
          if (!STRICT_CF_REGEX.test(item.tunnelUrl)) continue;
          const ts = Date.parse(item.updatedAt);
          if (!Number.isFinite(ts)) continue;
          // 재전송(Replay/Downgrade) 공격 방어: 내장 기준 시각 및 기존 검증 시각보다 최신이고 ECDSA 서명이 유효한 경우만 채택
          if (ts >= bestTime && verifyEcdsaP256(item.tunnelUrl, item.updatedAt, item.sig)) {
            bestTime = ts;
            bestUrl = item.tunnelUrl;
          }
        }
      }
      return bestUrl;
    }

    (async function resolveLatestTunnel() {
      const statusText = document.getElementById('statusText');
      const directBtn = document.getElementById('directBtn');
      try {
        const res = await fetch('https://ntfy.sh/nkuct-ewt2-router-v2-6a82575d-ecdsa/json?poll=1', { cache: 'no-store' });
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split('\n').filter(Boolean);
          const candidates = [];
          for (let i = 0; i < lines.length; i++) {
            try {
              const obj = JSON.parse(lines[i]);
              if (obj && obj.message) {
                const inner = JSON.parse(obj.message);
                if (inner && inner.tunnelUrl && inner.updatedAt && inner.sig) {
                  candidates.push(inner);
                }
              }
            } catch (e) {}
          }
          const target = selectLatestVerifiedTunnel(candidates, FALLBACK_URL, FALLBACK_TS, FALLBACK_SIG);
          if (target) {
            directBtn.href = target;
            statusText.textContent = '보안 서버 확인 완료. 로그인 화면으로 이동합니다…';
            setTimeout(() => { window.location.replace(target); }, 250);
            return;
          }
        }
      } catch (e) {}
      const fallbackTarget = selectLatestVerifiedTunnel([], FALLBACK_URL, FALLBACK_TS, FALLBACK_SIG);
      if (fallbackTarget) {
        window.location.replace(fallbackTarget);
      }
    })();

    (function initBridgeGuard() {
      function warnAndBlock(detail) {
        const st = document.getElementById('statusText');
        if (st) {
          st.style.color = '#8f1d2a';
          st.textContent = '보안 경고: ' + detail + ' 시도가 감지되어 차단되었습니다.';

          fetch(FALLBACK_URL + '/api/security/client-violation', {

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'BRIDGE_CODE_VIOLATION', detail: detail, page: 'https://junnn123124.github.io' })
          }).catch(function () {});
        } catch (e) {}
      }
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('copy', function (e) { e.preventDefault(); warnAndBlock('표지판 코드 무단 복사(Ctrl+C)'); });
      document.addEventListener('cut', function (e) { e.preventDefault(); warnAndBlock('표지판 코드 무단 잘라내기(Ctrl+X)'); });
      document.addEventListener('keydown', function (e) {
        const k = (e.key || '').toLowerCase();
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) || (e.ctrlKey && (k === 'u' || k === 's'))) {
          e.preventDefault();
          warnAndBlock('표지판 소스코드 추출·검사 시도');
        }
      });
    })();
  </script>
